name: orangcode-social

# Every published port is shifted so this stack can run next to the other validation
# projects: nothing here collides with the shop, with the template, or with a locally
# installed mongod on 27017.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # A single-node replica set. Mongo refuses transactions without one, and the same port is
    # used on both sides so the member address rs.initiate() advertises is reachable as-is
    # from the host.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27019']
    ports:
      - '27019:27019'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --port 27019 --quiet --eval ''try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27019" }] }).ok }''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6382:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. The application talks plain S3, so moving to AWS,
  # Scaleway or any other provider is a change of endpoint and credentials.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: social
      MINIO_ROOT_PASSWORD: social-secret
    ports:
      - '9020:9000'
      - '9021:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once and exits. Keeps bucket provisioning out of the application,
  # where it would run on every boot of every instance.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 social social-secret &&
      mc mb --ignore-existing local/social-media &&
      echo 'bucket ready'"

  # Catches every outgoing email in development: nothing can reach a real inbox by accident.
  # SMTP on 1027, web interface on http://localhost:8027.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1027:1025'
      - '8027:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  minio-data:
